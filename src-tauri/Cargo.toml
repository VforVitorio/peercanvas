[package]
name = "peer-canvas"
version = "0.1.0"
description = "Local-first desktop diagram editor"
license = "Apache-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "peer_canvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[features]
native-smoke = ["dep:tauri-plugin-wdio-webdriver", "dep:tauri-plugin-webrtc"]

[dependencies]
base64 = "=0.23.1"
flate2 = "=1.1.11"
percent-encoding = "=2.3.2"
quick-xml = { version = "=0.42.0", default-features = false }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "=2.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }
uuid = { version = "=1.29.1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-webrtc = { git = "https://github.com/crabnebula-dev/tauri-plugin-webrtc", rev = "5edeaa7863e0f7a8bbc8ac18cdc080a80470bb11", default-features = false, optional = true }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
