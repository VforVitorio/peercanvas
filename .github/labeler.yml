"area: frontend":
  - changed-files:
      - any-glob-to-any-file:
          - src/**
          - index.html
          - vite.config.ts
          - tailwind.config.js
"area: desktop":
  - changed-files:
      - any-glob-to-any-file:
          - src-tauri/**
"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - docs/**
          - openspec/**
"area: ci-cd":
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - scripts/setup-github.sh
"area: deps":
  - changed-files:
      - any-glob-to-any-file:
          - package.json
          - package-lock.json
          - src-tauri/Cargo.toml
          - src-tauri/Cargo.lock
"area: security":
  - changed-files:
      - any-glob-to-any-file:
          - docs/security/**
          - .github/workflows/codeql.yml
          - .github/workflows/security.yml
