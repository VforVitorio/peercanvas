name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      peer_smoke:
        description: Run the public-signaling WebRTC smoke in each native WebView
        required: false
        default: false
        type: boolean
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  native-scope:
    name: native-scope
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
      smoke: ${{ steps.scope.outputs.smoke }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: node scripts/ci-native-scope.mjs
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          components: rustfmt
      - run: npm ci
      - run: npm run lint
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
  native-build:
    needs: native-scope
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            check: native-linux
          - runner: macos-latest
            check: native-macos
          - runner: windows-latest
            check: native-windows
    name: ${{ matrix.check }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Skip native work when no native-sensitive files changed
        if: ${{ !cancelled() && needs.native-scope.result == 'success' && needs.native-scope.outputs.native == 'false' }}
        run: echo "No native-sensitive files changed; required native job is successful without rebuilding."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !cancelled() && (needs.native-scope.result != 'success' || (success() && needs.native-scope.outputs.native == 'true')) }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() && (needs.native-scope.result != 'success' || (success() && needs.native-scope.outputs.native == 'true')) }}
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        if: ${{ !cancelled() && (needs.native-scope.result != 'success' || (success() && needs.native-scope.outputs.native == 'true')) }}
        with:
          toolchain: stable
          rust-src-dir: src-tauri
      - name: Install Linux system dependencies
        if: ${{ !cancelled() && runner.os == 'Linux' && (needs.native-scope.result != 'success' || (success() && needs.native-scope.outputs.native == 'true')) }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget \
            xvfb
      - run: npm ci
        if: ${{ !cancelled() && (needs.native-scope.result != 'success' || (success() && needs.native-scope.outputs.native == 'true')) }}
      - name: Test native persistence and recovery
        if: ${{ !cancelled() && (needs.native-scope.result != 'success' || (success() && needs.native-scope.outputs.native == 'true')) }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build normal production shell
        if: ${{ !cancelled() && (needs.native-scope.result != 'success' || (success() && needs.native-scope.outputs.native == 'true')) }}
        run: npm run tauri -- build --no-bundle
      - name: Verify production frontend isolation
        if: ${{ !cancelled() && (needs.native-scope.result != 'success' || (success() && needs.native-scope.outputs.native == 'true')) }}
        run: npm run native-smoke -- --check-production
      - name: Build test-only native compatibility probe
        if: ${{ !cancelled() && (needs.native-scope.result != 'success' || (success() && needs.native-scope.outputs.smoke == 'true')) }}
        run: npm run native-smoke:build
      - name: Run native canvas smoke (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' && (needs.native-scope.result != 'success' || (success() && needs.native-scope.outputs.smoke == 'true')) }}
        run: xvfb-run -a -s "-screen 0 1280x800x24" npm run native-smoke
      - name: Run native canvas smoke (macOS and Windows)
        if: ${{ !cancelled() && runner.os != 'Linux' && (needs.native-scope.result != 'success' || (success() && needs.native-scope.outputs.smoke == 'true')) }}
        run: npm run native-smoke
      - name: Run public peer smoke (Linux)
        if: ${{ inputs.peer_smoke && runner.os == 'Linux' }}
        run: xvfb-run -a -s "-screen 0 1280x800x24" npm run native-smoke:public
      - name: Run public peer smoke (macOS and Windows)
        if: ${{ inputs.peer_smoke && runner.os != 'Linux' }}
        run: npm run native-smoke:public
      - name: Reject native-smoke feature in release builds
        if: ${{ !cancelled() && runner.os == 'Linux' && (needs.native-scope.result != 'success' || (success() && needs.native-scope.outputs.smoke == 'true')) }}
        shell: bash
        run: |
          set +e
          cargo check --manifest-path src-tauri/Cargo.toml --release --features native-smoke > src-tauri/target/native-smoke/release-guard.log 2>&1
          result=$?
          set -e
          cat src-tauri/target/native-smoke/release-guard.log
          test "$result" -ne 0
          grep -F "native-smoke feature cannot be used in a release build" src-tauri/target/native-smoke/release-guard.log
      - name: Upload native compatibility evidence
        if: ${{ always() && (needs.native-scope.outputs.smoke == 'true' || needs.native-scope.result != 'success') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-smoke-${{ runner.os }}
          path: src-tauri/target/native-smoke/
          retention-days: 14
