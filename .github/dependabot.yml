version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Madrid
    labels:
      - dependencies
      - "area: deps"

  - package-ecosystem: cargo
    directory: /src-tauri
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Madrid
    labels:
      - dependencies
      - "area: deps"

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Madrid
    labels:
      - dependencies
      - "area: ci-cd"
